name: Compile GCC

on:
  push:
    branches: [ "master", "ci", "autograd-capable" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo zlib1g-dev dejagnu

      - name: Configure GCC
        run: |
          mkdir build
          cd build
          ../configure --enable-languages=c,c++ --disable-bootstrap --disable-multilib

      - name: Build GCC
        run: |
          cd build
          make -j$(nproc)

      - name: Test Reflection
        run: |
          cd build/gcc
          make check-g++ RUNTESTFLAGS="dg.exp=reflect/*.C"
          ! grep -E '^(FAIL|XPASS|UNRESOLVED|ERROR):' testsuite/g++/g++.sum
          
