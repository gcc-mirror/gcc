name: Sync upstream GCC

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/gcc-mirror/gcc.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Fast-forward master
        run: |
          git checkout master
          git merge --ff-only upstream/master

      - name: Push master
        run: git push origin master

      - name: Rebase ci-base onto master
        run: |
          git fetch origin ci-base
          git checkout ci-base
          git rebase master

      - name: Force-push ci-base
        run: git push --force-with-lease origin ci-base
