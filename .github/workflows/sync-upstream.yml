name: Sync upstream GCC

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  BOT_NAME: BPF CI Bot
  BOT_EMAIL: bot+bpf-ci@kernel.org

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Clone (blobless)
        run: |
          git clone --filter=blob:none --sparse \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git sparse-checkout set .github
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git remote add upstream https://github.com/gcc-mirror/gcc.git

      - name: Sync master
        run: |
          git fetch --filter=blob:none upstream master
          git checkout -b master origin/master
          git merge --ff-only upstream/master
          git push origin master

      - name: Rebase ci-base
        run: |
          git fetch origin ci-base
          git checkout ci-base
          git rebase master
          git push --force-with-lease origin ci-base
